<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HK Minimal Dashboard - 時間．天氣．巴士即時資訊</title>
    <!-- Google Fonts: Noto Sans TC & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mono: {
                            50: '#fafafa',
                            100: '#f4f4f5',
                            200: '#e4e4e7',
                            300: '#d4d4d8',
                            400: '#a1a1aa',
                            500: '#71717a',
                            600: '#52525b',
                            700: '#3f3f46',
                            800: '#27272a',
                            900: '#18181b',
                            950: '#09090b',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', '-apple-system', 'BlinkMacSystemFont', '"PingFang TC"', '"Microsoft JhengHei"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #52525b;
        }
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
        body {
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans selection:bg-white selection:text-black antialiased transition-colors duration-300">

    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-3 sm:py-6 flex flex-col min-h-screen">
        
        <!-- TOP HEADER: Compact Mobile & Full Desktop layout -->
        <header class="border-b border-zinc-800 pb-3 sm:pb-6 mb-4 sm:mb-6 flex flex-col lg:flex-row lg:items-center justify-between gap-3 sm:gap-6">
            <!-- Left: Digital Clock & Date -->
            <div>
                <div class="flex items-center gap-2 mb-1 sm:mb-2">
                    <span class="text-[10px] sm:text-[11px] font-mono uppercase tracking-widest px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-300 font-semibold border border-zinc-700">HK MONO DASHBOARD</span>
                    <span id="system-status" class="text-[11px] sm:text-xs font-mono text-zinc-400 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 連線正常
                    </span>
                </div>
                <div id="clock-time" class="text-4xl sm:text-7xl lg:text-8xl font-mono font-black tracking-tight tabular-nums leading-none my-0.5 sm:my-1 text-white">
                    00:00:00
                </div>
                <div id="clock-date" class="text-xs sm:text-base font-medium text-zinc-400">
                    ----年--月--日 星期-
                </div>
            </div>

            <!-- Right: Status Timers & Action Controls (Ultra Compact on Mobile) -->
            <div class="flex flex-wrap items-center justify-between sm:justify-start gap-2 text-[11px] sm:text-xs font-mono border-t lg:border-t-0 border-zinc-800/80 pt-2.5 sm:pt-0">
                <!-- Bus ETA 30s Countdown -->
                <div class="flex flex-col justify-between bg-zinc-900 border border-zinc-800 rounded-xl px-2.5 py-1.5 sm:p-3 h-10 sm:h-14 flex-1 sm:flex-initial min-w-[110px] sm:min-w-[140px]">
                    <div class="flex justify-between items-center gap-1 text-zinc-400 text-[10px] sm:text-xs">
                        <span>巴士 ETA</span>
                        <span id="bus-countdown" class="font-bold tabular-nums text-white">30s</span>
                    </div>
                    <div class="w-full bg-zinc-800 rounded-full h-1 sm:h-1.5 overflow-hidden mt-0.5">
                        <div id="bus-progress-bar" class="bg-emerald-500 h-full w-full transition-all duration-1000 linear rounded-full"></div>
                    </div>
                </div>

                <!-- Weather Last Sync Status -->
                <div class="flex flex-col justify-between bg-zinc-900 border border-zinc-800 rounded-xl px-2.5 py-1.5 sm:p-3 h-10 sm:h-14 flex-1 sm:flex-initial min-w-[100px] sm:min-w-[130px]">
                    <span class="text-zinc-400 text-[10px] sm:text-xs">天氣同步</span>
                    <span id="weather-last-updated" class="font-bold tabular-nums text-white text-xs sm:text-sm">已同步</span>
                </div>

                <!-- Actions: Theme Toggle & Manual Refresh -->
                <div class="flex items-center gap-1.5 sm:gap-2 h-10 sm:h-14">
                    <button onclick="toggleDarkMode()" title="切換黑白主題" class="h-10 w-10 sm:h-14 sm:w-14 rounded-xl bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 hover:border-zinc-700 transition flex items-center justify-center text-zinc-200 active:scale-95">
                        <i data-lucide="sun-moon" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                    </button>
                    <button onclick="refreshAllData()" title="手動更新" class="h-10 sm:h-14 px-3 sm:px-4 rounded-xl bg-zinc-100 text-zinc-950 hover:bg-white font-bold transition flex items-center justify-center gap-1.5 text-xs sm:text-sm shadow-sm active:scale-95">
                        <i data-lucide="rotate-cw" class="w-3.5 h-3.5 sm:w-4 sm:h-4" id="refresh-icon"></i>
                        <span>更新</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT GRID: Flexible order for Mobile (Bus ETA top, Weather bottom) -->
        <main class="flex flex-col lg:grid lg:grid-cols-12 gap-4 sm:gap-6 flex-grow">
            
            <!-- BUS MONITOR SECTION (Order 1 on Mobile, Order 2 / Col-span-7 on Desktop) -->
            <section class="order-1 lg:order-2 lg:col-span-7 flex flex-col gap-4 sm:gap-6">
                <div class="bg-zinc-900/80 border border-zinc-800/80 rounded-2xl p-4 sm:p-6 shadow-sm flex-grow flex flex-col backdrop-blur-sm">
                    
                    <!-- Bus Monitor Header -->
                    <div class="flex justify-between items-center gap-2 mb-3 sm:mb-6 pb-3 sm:pb-4 border-b border-zinc-800">
                        <div>
                            <h2 class="text-xs uppercase font-mono text-zinc-400 tracking-wider">巴士到站時間即時預報 (ETA)</h2>
                            <p class="text-[11px] sm:text-xs text-zinc-500 mt-0.5 hidden sm:block">每 30 秒自動更新，超大字號顯示下一班車</p>
                        </div>
                        <button onclick="openBusModal()" class="px-3 py-1.5 sm:px-4 sm:py-2.5 bg-zinc-800 hover:bg-zinc-700 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 border border-zinc-700 active:scale-95 shrink-0">
                            <i data-lucide="plus" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                            <span class="text-[11px] sm:text-xs">管理車站</span>
                        </button>
                    </div>

                    <!-- Saved Bus Cards Grid -->
                    <div id="bus-cards-list" class="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4 flex-grow content-start">
                        <!-- Dynamic Bus Cards injected by JavaScript -->
                    </div>
                </div>
            </section>

            <!-- HKO WEATHER SECTION (Order 2 on Mobile, Order 1 / Col-span-5 on Desktop) -->
            <section class="order-2 lg:order-1 lg:col-span-5 flex flex-col gap-4 sm:gap-6">
                
                <!-- Current Weather Card -->
                <div class="bg-zinc-900/80 border border-zinc-800/80 rounded-2xl p-4 sm:p-6 shadow-sm space-y-3 sm:space-y-5 backdrop-blur-sm">
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 class="text-[10px] sm:text-xs uppercase font-mono text-zinc-400 tracking-wider">香港天文台即時天氣</h2>
                            <p id="weather-location" class="text-lg sm:text-xl font-bold text-white mt-0.5">香港天文台</p>
                        </div>
                        <div id="weather-icon-badge" class="bg-zinc-800 border border-zinc-700 px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-xl text-xs sm:text-sm font-mono font-bold text-emerald-400">
                            --°C
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 py-2.5 sm:py-3 border-y border-zinc-800/80">
                        <div>
                            <span class="text-[11px] sm:text-xs text-zinc-400 block font-medium mb-0.5">現時氣溫</span>
                            <div class="flex items-baseline">
                                <span id="curr-temp" class="text-3xl sm:text-4xl font-mono font-black tabular-nums text-white">--</span>
                                <span class="text-lg sm:text-xl font-bold text-zinc-400 ml-1">°C</span>
                            </div>
                        </div>
                        <div>
                            <span class="text-[11px] sm:text-xs text-zinc-400 block font-medium mb-0.5">相對濕度</span>
                            <div class="flex items-baseline">
                                <span id="curr-humidity" class="text-3xl sm:text-4xl font-mono font-black tabular-nums text-white">--</span>
                                <span class="text-lg sm:text-xl font-bold text-zinc-400 ml-1">%</span>
                            </div>
                        </div>
                    </div>

                    <!-- UV & Warnings Container -->
                    <div class="flex flex-wrap gap-2 text-xs" id="weather-warnings-container">
                        <div id="uv-badge" class="bg-zinc-800/60 border border-zinc-700/60 px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-lg text-zinc-300 text-[11px] sm:text-xs">
                            紫外線指數: <span id="uv-index" class="font-bold text-white">--</span>
                        </div>
                    </div>
                </div>

                <!-- 5-Day Forecast Card -->
                <div class="bg-zinc-900/80 border border-zinc-800/80 rounded-2xl p-4 sm:p-6 shadow-sm flex-grow flex flex-col backdrop-blur-sm">
                    <div class="flex justify-between items-center mb-3 sm:mb-4">
                        <h3 class="text-[10px] sm:text-xs uppercase font-mono text-zinc-400 tracking-wider">未來 5 天天氣預報</h3>
                        <span class="text-[11px] font-mono text-zinc-500">5 天簡報</span>
                    </div>

                    <div id="forecast-container" class="space-y-2 flex-grow">
                        <div class="text-zinc-500 text-xs font-mono py-6 text-center">載入天氣預報中...</div>
                    </div>
                </div>
            </section>

        </main>

        <footer class="mt-6 sm:mt-8 pt-3 sm:pt-4 border-t border-zinc-800 text-center text-[11px] sm:text-xs text-zinc-500 flex flex-col sm:flex-row justify-between items-center gap-1.5">
            <div>數據來源：香港天文台 (HKO) &amp; DATA.GOV.HK (九巴 KMB API)</div>
            <div>自動更新中 · 極簡黑白響應式介面</div>
        </footer>
    </div>

    <!-- BUS MANAGEMENT MODAL -->
    <div id="bus-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-lg p-5 sm:p-6 rounded-2xl space-y-4 sm:space-y-5 max-h-[90vh] flex flex-col shadow-2xl text-zinc-100">
            
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h3 class="text-xs sm:text-sm font-bold uppercase tracking-wider text-white">新增關注巴士路線與車站</h3>
                <button onclick="closeBusModal()" class="p-1 text-zinc-400 hover:text-white transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Step 1: Input Route -->
            <div class="space-y-1.5 sm:space-y-2">
                <label class="text-xs text-zinc-400 block font-medium">1. 輸入九巴路線號碼 (例如: 270A, 270B, 273, 1A, 968)</label>
                <div class="flex gap-2">
                    <input type="text" id="modal-route-input" placeholder="路線 (如: 270A)" class="bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2 sm:px-4 sm:py-2.5 text-sm font-mono text-white placeholder-zinc-600 focus:outline-none focus:border-emerald-500 flex-grow uppercase">
                    <button onclick="searchBusRoute()" class="px-4 py-2 sm:px-5 sm:py-2.5 bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold rounded-xl text-xs transition active:scale-95">
                        搜尋路線
                    </button>
                </div>
            </div>

            <!-- Step 2: Select Direction & Stop -->
            <div id="modal-step-2" class="space-y-3 sm:space-y-4 hidden flex-grow overflow-y-auto">
                <div class="space-y-1.5">
                    <label class="text-xs text-zinc-400 block font-medium">2. 選擇行車方向</label>
                    <select id="modal-bound-select" onchange="onDirectionChange()" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs text-zinc-400 block font-medium">3. 選擇巴士站</label>
                    <select id="modal-stop-select" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </select>
                </div>

                <button onclick="addSelectedBusStop()" class="w-full py-2.5 sm:py-3 bg-white hover:bg-zinc-200 text-zinc-950 font-bold rounded-xl text-xs uppercase transition shadow active:scale-95">
                    ＋ 加入我的看板
                </button>
            </div>

            <!-- Preset Quick Add Options -->
            <div class="border-t border-zinc-800 pt-3 sm:pt-4">
                <p class="text-xs text-zinc-400 mb-2">快速加入熱門預設站點：</p>
                <div class="flex flex-wrap gap-1.5 sm:gap-2 text-xs">
                    <button onclick="addPresetStop('270A', 'outbound', 'BS23-T-1200-0', '華明轉車站', '尖沙咀東')" class="bg-zinc-800/80 hover:bg-zinc-700 border border-zinc-700/80 px-2.5 py-1.5 rounded-lg text-zinc-200 text-[11px] sm:text-xs transition">
                        + 270A (華明轉車站)
                    </button>
                    <button onclick="addPresetStop('270B', 'outbound', 'BS23-T-1250-0', '華明轉車站', '奧運站')" class="bg-zinc-800/80 hover:bg-zinc-700 border border-zinc-700/80 px-2.5 py-1.5 rounded-lg text-zinc-200 text-[11px] sm:text-xs transition">
                        + 270B (華明轉車站)
                    </button>
                    <button onclick="addPresetStop('273', 'outbound', 'BS23-T-1000-0', '華明邨總站', '粉嶺站')" class="bg-zinc-800/80 hover:bg-zinc-700 border border-zinc-700/80 px-2.5 py-1.5 rounded-lg text-zinc-200 text-[11px] sm:text-xs transition">
                        + 273 (華明邨總站)
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Storage Key
        const STORAGE_KEY_SAVED_BUSES = 'hk_mono_saved_buses_v3';
        
        // Intervals
        const BUS_REFRESH_INTERVAL_SEC = 30;
        const WEATHER_REFRESH_INTERVAL_MIN = 15;

        // Timers & State
        let busCountdown = BUS_REFRESH_INTERVAL_SEC;
        let busTimer = null;
        let weatherTimer = null;
        let clockTimer = null;

        // Default Presets
        const defaultBusStops = [
            {
                id: '270A_outbound_BS23-T-1200-0',
                route: '270A',
                bound: 'outbound',
                serviceType: '1',
                stopId: 'BS23-T-1200-0',
                stopName: '華明轉車站',
                destName: '尖沙咀東(麼地道)'
            },
            {
                id: '270B_outbound_BS23-T-1250-0',
                route: '270B',
                bound: 'outbound',
                serviceType: '1',
                stopId: 'BS23-T-1250-0',
                stopName: '華明轉車站 － 粉嶺站',
                destName: '奧運站'
            },
            {
                id: '273_outbound_BS23-T-1000-0',
                route: '273',
                bound: 'outbound',
                serviceType: '1',
                stopId: 'BS23-T-1000-0',
                stopName: '華明邨總站',
                destName: '粉嶺站(循環線)'
            }
        ];

        let savedBusStops = [];
        let currentSearchedRouteData = null;

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadSavedBusStops();

            updateClock();
            clockTimer = setInterval(updateClock, 1000);

            fetchWeather();
            fetchAllBusETAs();

            startBusTimer();
            weatherTimer = setInterval(fetchWeather, WEATHER_REFRESH_INTERVAL_MIN * 60 * 1000);
        });

        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
            } else {
                html.classList.add('dark');
            }
        }

        function updateClock() {
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock-time').textContent = `${hours}:${minutes}:${seconds}`;

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekday = weekdays[now.getDay()];

            document.getElementById('clock-date').textContent = `${year}年${month}月${date}日 ${weekday}`;
        }

        function startBusTimer() {
            if (busTimer) clearInterval(busTimer);
            busCountdown = BUS_REFRESH_INTERVAL_SEC;
            updateBusTimerUI();

            busTimer = setInterval(() => {
                busCountdown--;
                if (busCountdown <= 0) {
                    busCountdown = BUS_REFRESH_INTERVAL_SEC;
                    fetchAllBusETAs();
                }
                updateBusTimerUI();
            }, 1000);
        }

        function updateBusTimerUI() {
            document.getElementById('bus-countdown').textContent = `${busCountdown}s`;
            const percentage = (busCountdown / BUS_REFRESH_INTERVAL_SEC) * 100;
            document.getElementById('bus-progress-bar').style.width = `${percentage}%`;
        }

        function refreshAllData() {
            const icon = document.getElementById('refresh-icon');
            if (icon) icon.classList.add('animate-spin');

            Promise.all([fetchWeather(), fetchAllBusETAs()]).finally(() => {
                setTimeout(() => {
                    if (icon) icon.classList.remove('animate-spin');
                }, 500);
            });

            busCountdown = BUS_REFRESH_INTERVAL_SEC;
            updateBusTimerUI();
        }

        async function fetchWeather() {
            try {
                const resCurr = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const dataCurr = await resCurr.json();

                const resFnd = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const dataFnd = await resFnd.json();

                renderCurrentWeather(dataCurr);
                renderForecast(dataFnd);

                const now = new Date();
                document.getElementById('weather-last-updated').textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            } catch (err) {
                console.error('Weather fetch error:', err);
            }
        }

        function renderCurrentWeather(data) {
            if (data.temperature && data.temperature.data.length > 0) {
                const hkTemp = data.temperature.data.find(d => d.place === '香港天文台') || data.temperature.data[0];
                document.getElementById('curr-temp').textContent = hkTemp.value;
                document.getElementById('weather-icon-badge').textContent = `${hkTemp.value}°C`;
            }

            if (data.humidity && data.humidity.data.length > 0) {
                document.getElementById('curr-humidity').textContent = data.humidity.data[0].value;
            }

            const uvContainer = document.getElementById('uv-badge');
            if (data.uvindex && data.uvindex.data && data.uvindex.data.length > 0) {
                document.getElementById('uv-index').textContent = data.uvindex.data[0].value;
                uvContainer.classList.remove('hidden');
            } else {
                uvContainer.classList.add('hidden');
            }

            const warningContainer = document.getElementById('weather-warnings-container');
            const oldWarnings = warningContainer.querySelectorAll('.warning-item');
            oldWarnings.forEach(el => el.remove());

            if (data.warningMessage && Array.isArray(data.warningMessage) && data.warningMessage.length > 0) {
                data.warningMessage.forEach(msg => {
                    const warnDiv = document.createElement('div');
                    warnDiv.className = 'warning-item bg-amber-500/10 border border-amber-500/30 text-amber-300 px-2.5 py-1 rounded-lg font-bold text-[11px] sm:text-xs';
                    warnDiv.textContent = msg;
                    warningContainer.appendChild(warnDiv);
                });
            }
        }

        function renderForecast(data) {
            const container = document.getElementById('forecast-container');
            container.innerHTML = '';

            if (!data || !data.weatherForecast || data.weatherForecast.length === 0) {
                container.innerHTML = '<div class="text-zinc-500 text-xs font-mono py-4 text-center">暫無預報資料</div>';
                return;
            }

            const fiveDayForecast = data.weatherForecast.slice(0, 5);

            fiveDayForecast.forEach(day => {
                const formattedDate = `${day.forecastDate.substring(4,6)}/${day.forecastDate.substring(6,8)}`;
                const minTemp = typeof day.forecastMintemp === 'object' ? day.forecastMintemp.value : day.forecastMintemp;
                const maxTemp = typeof day.forecastMaxtemp === 'object' ? day.forecastMaxtemp.value : day.forecastMaxtemp;

                const weatherText = day.forecastWeather || '';
                let rainStatus = '無雨';
                let rainIcon = 'sun';

                if (weatherText.includes('雷暴') || weatherText.includes('大雨') || weatherText.includes('狂風')) {
                    rainStatus = '有雨';
                    rainIcon = 'cloud-rain';
                } else if (weatherText.includes('雨') || weatherText.includes('驟雨')) {
                    rainStatus = '有微雨';
                    rainIcon = 'cloud-drizzle';
                } else if (weatherText.includes('雲') || weatherText.includes('陰')) {
                    rainStatus = '多雲';
                    rainIcon = 'cloud';
                }

                const row = document.createElement('div');
                row.className = 'bg-zinc-950/60 border border-zinc-800/60 rounded-xl p-2.5 sm:p-3 flex items-center justify-between text-xs hover:border-zinc-700 transition gap-2';
                
                row.innerHTML = `
                    <div class="flex items-center gap-2 w-24 sm:w-28 shrink-0">
                        <span class="font-mono font-bold text-xs sm:text-sm text-white">${formattedDate}</span>
                        <span class="text-zinc-400 text-[11px] font-medium">${day.week}</span>
                    </div>
                    <div class="flex items-center gap-1.5 text-zinc-300 flex-grow font-medium text-[11px] sm:text-xs">
                        <i data-lucide="${rainIcon}" class="w-3.5 h-3.5 sm:w-4 sm:h-4 shrink-0 text-zinc-400"></i>
                        <span>${rainStatus}</span>
                    </div>
                    <div class="font-mono font-bold tabular-nums text-xs sm:text-sm text-white shrink-0">
                        ${minTemp}° - ${maxTemp}°C
                    </div>
                `;
                container.appendChild(row);
            });

            lucide.createIcons();
        }

        function loadSavedBusStops() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY_SAVED_BUSES);
                if (stored) {
                    savedBusStops = JSON.parse(stored);
                } else {
                    savedBusStops = [...defaultBusStops];
                    saveBusStopsToStorage();
                }
            } catch (e) {
                savedBusStops = [...defaultBusStops];
            }
            renderBusCardsSkeleton();
        }

        function saveBusStopsToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY_SAVED_BUSES, JSON.stringify(savedBusStops));
            } catch (e) {
                console.error('Failed to save to localStorage', e);
            }
        }

        function removeBusStop(id) {
            savedBusStops = savedBusStops.filter(item => item.id !== id);
            saveBusStopsToStorage();
            renderBusCardsSkeleton();
            fetchAllBusETAs();
        }

        function renderBusCardsSkeleton() {
            const container = document.getElementById('bus-cards-list');
            container.innerHTML = '';

            if (savedBusStops.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full border border-dashed border-zinc-800 rounded-2xl p-6 sm:p-8 text-center text-xs font-mono text-zinc-500">
                        尚未新增關注巴士站。點擊上方「管理車站」加入常用的路線。
                    </div>
                `;
                return;
            }

            savedBusStops.forEach(item => {
                const card = document.createElement('div');
                card.id = `bus-card-${item.id}`;
                card.className = 'bg-zinc-950/70 border border-zinc-800 rounded-2xl p-3.5 sm:p-5 flex flex-col justify-between relative shadow-sm hover:border-zinc-700/80 transition';
                
                card.innerHTML = `
                    <!-- Header Zone with strict h-[56px] sm:h-[68px] fixed height constraint -->
                    <div class="h-[56px] sm:h-[68px] mb-2 sm:mb-3 flex justify-between items-start gap-2 overflow-hidden border-b border-zinc-800/80 pb-1.5 sm:pb-2">
                        <div class="min-w-0 flex-1 space-y-0.5 sm:space-y-1">
                            <div class="flex items-center gap-1.5 sm:gap-2">
                                <span class="text-base sm:text-xl font-mono font-black px-2 py-0.5 rounded-lg bg-zinc-800 text-white border border-zinc-700 shrink-0">${item.route}</span>
                                <span class="text-[11px] sm:text-xs text-zinc-400 font-medium truncate block flex-1" title="往 ${item.destName || '目的地'}">往 ${item.destName || '目的地'}</span>
                            </div>
                            <div class="text-[11px] sm:text-xs font-bold text-zinc-200 truncate leading-tight pt-0.5" title="${item.stopName}">${item.stopName}</div>
                        </div>
                        <button onclick="removeBusStop('${item.id}')" title="刪除" class="text-zinc-500 hover:text-rose-400 p-1 rounded-lg hover:bg-zinc-800 transition shrink-0">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                        </button>
                    </div>

                    <div id="eta-list-${item.id}" class="space-y-1.5 sm:space-y-2 flex-grow flex flex-col justify-start">
                        <div class="text-xs font-mono text-zinc-500 animate-pulse py-3 text-center">載入到站時間中...</div>
                    </div>
                `;
                container.appendChild(card);
            });

            lucide.createIcons();
        }

        async function fetchAllBusETAs() {
            if (savedBusStops.length === 0) return;
            for (const item of savedBusStops) {
                fetchSingleBusETA(item);
            }
        }

        async function fetchSingleBusETA(item) {
            const container = document.getElementById(`eta-list-${item.id}`);
            if (!container) return;

            try {
                const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${item.stopId}`);
                const data = await response.json();

                if (!data || !data.data) {
                    container.innerHTML = `<div class="text-xs font-mono text-zinc-500 py-3 text-center">無法獲取數據</div>`;
                    return;
                }

                const boundDir = item.bound === 'outbound' ? 'O' : 'I';
                const now = new Date();

                // Filter out stale/expired arrivals (> 45s passed)
                const matchedETAs = data.data.filter(eta => {
                    if (eta.route !== item.route) return false;
                    if (eta.dir && eta.dir !== boundDir) return false;
                    if (!eta.eta) return false;

                    const etaDate = new Date(eta.eta);
                    const diffSec = (etaDate - now) / 1000;
                    return diffSec >= -45;
                });

                if (matchedETAs.length === 0) {
                    container.innerHTML = `<div class="text-xs text-zinc-500 py-4 text-center font-medium">目前未有即時班次預報</div>`;
                    return;
                }

                container.innerHTML = '';

                const formatEta = (etaObj) => {
                    if (!etaObj || !etaObj.eta) return { statusText: '--', timeText: '--:--', diffMin: -1, isArriving: false };
                    const etaDate = new Date(etaObj.eta);
                    const diffSec = Math.round((etaDate - now) / 1000);
                    const diffMin = Math.floor((etaDate - now) / 60000);
                    const timeFormatted = `${String(etaDate.getHours()).padStart(2,'0')}:${String(etaDate.getMinutes()).padStart(2,'0')}`;

                    if (diffSec <= 60 || diffMin <= 0) {
                        return { statusText: '即將到達', timeText: timeFormatted, diffMin: 0, isArriving: true };
                    }
                    return { statusText: `${diffMin}`, timeText: timeFormatted, diffMin, isArriving: false };
                };

                const topEta = matchedETAs[0];
                const otherEtas = matchedETAs.slice(1, 3);
                const firstResult = formatEta(topEta);

                // --- HERO NEXT BUS DISPLAY WITH GIANT MINUTE NUMBERS ---
                const heroBox = document.createElement('div');
                
                let highlightClass = "text-white";
                let bgBorderClass = "bg-zinc-900 border-zinc-800";
                
                if (firstResult.isArriving) {
                    highlightClass = "text-amber-400";
                    bgBorderClass = "bg-amber-950/20 border-amber-500/40";
                } else if (firstResult.diffMin <= 5) {
                    highlightClass = "text-emerald-400";
                    bgBorderClass = "bg-emerald-950/20 border-emerald-500/40";
                }

                heroBox.className = `p-3 sm:p-4 rounded-xl border ${bgBorderClass} flex justify-between items-center transition-all my-0.5 sm:my-1`;
                
                if (firstResult.isArriving) {
                    heroBox.innerHTML = `
                        <div class="space-y-0.5">
                            <div class="text-[9px] sm:text-[10px] uppercase font-mono tracking-wider text-amber-400/90 font-bold">下一班車</div>
                            <div class="text-2xl sm:text-4xl font-black tracking-tight text-amber-400 animate-pulse">即將到達</div>
                        </div>
                        <div class="text-right font-mono">
                            <div class="text-[10px] sm:text-[11px] text-zinc-400">${topEta.rmk_tc ? `[${topEta.rmk_tc}]` : '預計到站'}</div>
                            <div class="text-sm sm:text-base font-bold tabular-nums text-white">${firstResult.timeText}</div>
                        </div>
                    `;
                } else {
                    heroBox.innerHTML = `
                        <div class="space-y-0.5">
                            <div class="text-[9px] sm:text-[10px] uppercase font-mono tracking-wider text-zinc-400 font-medium">下一班車</div>
                            <div class="flex items-baseline gap-1">
                                <span class="text-4xl sm:text-6xl font-mono font-black tracking-tight tabular-nums ${highlightClass}">${firstResult.statusText}</span>
                                <span class="text-xs sm:text-sm font-bold text-zinc-400">分鐘</span>
                            </div>
                        </div>
                        <div class="text-right font-mono">
                            <div class="text-[10px] sm:text-[11px] text-zinc-400">${topEta.rmk_tc ? `[${topEta.rmk_tc}]` : '預計到站'}</div>
                            <div class="text-base sm:text-lg font-bold tabular-nums text-white">${firstResult.timeText}</div>
                        </div>
                    `;
                }

                container.appendChild(heroBox);

                // Subsequent Buses (2nd & 3rd)
                if (otherEtas.length > 0) {
                    const subList = document.createElement('div');
                    subList.className = 'space-y-1 pt-1 text-[11px] sm:text-xs font-mono';

                    otherEtas.forEach((eta, idx) => {
                        const res = formatEta(eta);
                        const displayVal = res.isArriving ? '即將到達' : `${res.statusText} 分鐘`;
                        const row = document.createElement('div');
                        row.className = 'flex justify-between items-center text-zinc-400 py-0.5 sm:py-1 border-b border-zinc-800/60 last:border-none';
                        row.innerHTML = `
                            <span class="text-zinc-400">第 ${idx + 2} 班 ${eta.rmk_tc ? `(${eta.rmk_tc})` : ''}</span>
                            <span class="tabular-nums font-bold text-white">${displayVal} <span class="font-normal text-zinc-500 text-[10px] sm:text-[11px]">(${res.timeText})</span></span>
                        `;
                        subList.appendChild(row);
                    });
                    container.appendChild(subList);
                }

            } catch (err) {
                console.error(`Error fetching ETA for ${item.route}:`, err);
                if (container) {
                    container.innerHTML = `<div class="text-xs font-mono text-zinc-500 py-3 text-center">網絡更新失敗</div>`;
                }
            }
        }

        function openBusModal() {
            document.getElementById('bus-modal').classList.remove('hidden');
        }

        function closeBusModal() {
            document.getElementById('bus-modal').classList.add('hidden');
        }

        async function searchBusRoute() {
            const input = document.getElementById('modal-route-input').value.trim().toUpperCase();
            if (!input) return;

            const step2 = document.getElementById('modal-step-2');
            const boundSelect = document.getElementById('modal-bound-select');

            step2.classList.add('hidden');
            boundSelect.innerHTML = '<option>搜尋中...</option>';

            try {
                const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/`);
                const routeData = await res.json();

                if (!routeData || !routeData.data) return;

                const matches = routeData.data.filter(r => r.route === input);

                if (matches.length === 0) {
                    alert(`找不到路線 ${input}，請確認號碼是否正確。`);
                    return;
                }

                currentSearchedRouteData = matches;

                boundSelect.innerHTML = '';
                matches.forEach((m, idx) => {
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.textContent = `往 ${m.dest_tc} (經由 ${m.orig_tc})`;
                    boundSelect.appendChild(opt);
                });

                step2.classList.remove('hidden');
                onDirectionChange();

            } catch (e) {
                console.error(e);
                alert('搜尋路線時發生錯誤');
            }
        }

        async function onDirectionChange() {
            if (!currentSearchedRouteData) return;

            const selectedIdx = document.getElementById('modal-bound-select').value;
            const routeObj = currentSearchedRouteData[selectedIdx];
            const stopSelect = document.getElementById('modal-stop-select');

            stopSelect.innerHTML = '<option>載入車站清單中...</option>';

            const boundParam = routeObj.bound === 'O' ? 'outbound' : 'inbound';

            try {
                const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${routeObj.route}/${boundParam}/${routeObj.service_type}`);
                const stopData = await res.json();

                if (!stopData || !stopData.data) return;

                stopSelect.innerHTML = '';

                const stops = stopData.data;
                for (let i = 0; i < stops.length; i++) {
                    const s = stops[i];
                    const stopRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${s.stop}`);
                    const stopInfo = await stopRes.json();
                    
                    const name = stopInfo.data ? stopInfo.data.name_tc : s.stop;

                    const opt = document.createElement('option');
                    opt.value = JSON.stringify({
                        stopId: s.stop,
                        stopName: name,
                        route: routeObj.route,
                        bound: boundParam,
                        serviceType: routeObj.service_type,
                        destName: routeObj.dest_tc
                    });
                    opt.textContent = `${s.seq}. ${name}`;
                    stopSelect.appendChild(opt);
                }

            } catch (e) {
                console.error(e);
                stopSelect.innerHTML = '<option>載入車站失敗</option>';
            }
        }

        function addSelectedBusStop() {
            const stopSelect = document.getElementById('modal-stop-select');
            if (!stopSelect.value) return;

            const data = JSON.parse(stopSelect.value);
            const id = `${data.route}_${data.bound}_${data.stopId}`;

            if (savedBusStops.some(item => item.id === id)) {
                alert('該巴士站已在你的看板中！');
                return;
            }

            savedBusStops.push({
                id: id,
                route: data.route,
                bound: data.bound,
                serviceType: data.serviceType,
                stopId: data.stopId,
                stopName: data.stopName,
                destName: data.destName
            });

            saveBusStopsToStorage();
            renderBusCardsSkeleton();
            fetchAllBusETAs();
            closeBusModal();
        }

        function addPresetStop(route, bound, stopId, stopName, destName) {
            const id = `${route}_${bound}_${stopId}`;
            if (savedBusStops.some(item => item.id === id)) {
                alert('該巴士站已在你的看板中！');
                return;
            }

            savedBusStops.push({
                id, route, bound, serviceType: '1', stopId, stopName, destName
            });

            saveBusStopsToStorage();
            renderBusCardsSkeleton();
            fetchAllBusETAs();
            closeBusModal();
        }
    </script>
</body>
</html>
